<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Action Platformer</title>
    <!-- Load Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #444;
        }
    </style>
</head>
<body>

<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainScene' });
    }

    create() {
        // 1. World & Camera Setup
        this.cameras.main.setBackgroundColor('#1a1a24');

        // Create platforms static group
        this.platforms = this.physics.add.staticGroup();

        // Create ground and walls using generated texture blocks
        this.createEnvironment();

        // 2. Player Setup
        // Generate a simple rectangle texture for the player
        const graphics = this.add.graphics();
        graphics.fillStyle(0xffffff, 1);
        graphics.fillRect(0, 0, 24, 36);
        graphics.generateTexture('playerTexture', 24, 36);
        graphics.destroy();

        this.player = this.physics.add.sprite(100, 300, 'playerTexture');
        this.player.setCollideWorldBounds(true);
        this.player.body.setGravityY(800); // Apply gravity to player

        // Enable collision between player and platforms
        this.physics.add.collider(this.player, this.platforms);

        // 3. Movement Variables
        this.SPEED = 220;
        this.JUMP_VELOCITY = -420;
        this.WALL_SLIDE_SPEED = 60;

        // 4. Input Setup
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D,
            space: Phaser.Input.Keyboard.KeyCodes.SPACE
        });
    }

    update() {
        const onFloor = this.player.body.touching.down;
        const onWall = this.player.body.touching.left || this.player.body.touching.right;

        const leftPressed = this.cursors.left.isDown || this.wasd.left.isDown;
        const rightPressed = this.cursors.right.isDown || this.wasd.right.isDown;
        const jumpPressed = Phaser.Input.Keyboard.JustDown(this.cursors.up) || 
                            Phaser.Input.Keyboard.JustDown(this.wasd.up) || 
                            Phaser.Input.Keyboard.JustDown(this.wasd.space);

        // Horizontal Movement
        if (leftPressed) {
            this.player.setVelocityX(-this.SPEED);
        } else if (rightPressed) {
            this.player.setVelocityX(this.SPEED);
        } else {
            this.player.setVelocityX(0);
        }

        // Jump Mechanics
        if (jumpPressed && onFloor) {
            this.player.setVelocityY(this.JUMP_VELOCITY);
        }

        // Wall Slide Mechanics
        if (onWall && !onFloor && this.player.body.velocity.y > 0) {
            this.player.setVelocityY(Math.min(this.player.body.velocity.y, this.WALL_SLIDE_SPEED));
            
            // Wall Jump
            if (jumpPressed) {
                const jumpDirection = this.player.body.touching.left ? 1 : -1;
                this.player.setVelocityX(this.SPEED * jumpDirection);
                this.player.setVelocityY(this.JUMP_VELOCITY);
            }
        }
    }

    createEnvironment() {
        // Draw platform texture
        const g = this.add.graphics();
        g.fillStyle(0x444455, 1);
        g.fillRect(0, 0, 32, 32);
        g.generateTexture('block', 32, 32);
        g.destroy();

        // Floor
        for (let x = 0; x < 800; x += 32) {
            this.platforms.create(x + 16, 584, 'block');
        }

        // Left & Right Outer Walls
        for (let y = 0; y < 600; y += 32) {
            this.platforms.create(16, y + 16, 'block');
            this.platforms.create(784, y + 16, 'block');
        }

        // Mid-air Platforms & Walls to test climbing
        for (let y = 300; y < 500; y += 32) {
            this.platforms.create(300, y, 'block'); // Vertical wall for sliding
        }

        for (let x = 450; x < 650; x += 32) {
            this.platforms.create(x, 400, 'block'); // Platform
        }
    }
}

// Phaser Game Configuration
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 }, // Handled individually per body
            debug: false
        }
    },
    scene: MainScene
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
